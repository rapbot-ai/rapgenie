<svg viewBox="0 0 1000 668" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>The training loop: clip, batch, iteration, step, epoch, checkpoint</title>
  <desc>One Lupe Fiasco audio clip flows from a 1,000-clip dataset into batches within an epoch; each batch drives one iteration (one step); steps accumulate on a timeline where checkpoints are saved every 20 steps.</desc>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#8a919c"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2f9e63"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="998" height="666" rx="14" fill="#ffffff" stroke="#e5e8ec"/>
  <text x="500" y="34" text-anchor="middle" font-size="14" font-weight="600" fill="#374151">Training the Lupe Fiasco voice model — one clip's journey</text>

  <!-- ============ DATASET ============ -->
  <rect x="24" y="56" width="170" height="230" rx="10" fill="#f7f8fa" stroke="#d7dbe1"/>
  <text x="109" y="78" text-anchor="middle" font-size="11" font-weight="700" fill="#4b5563" letter-spacing="1">DATASET</text>
  <text x="109" y="93" text-anchor="middle" font-size="10" fill="#6b7280">1,000 Lupe clips</text>
  <g fill="#ccd2da">
    <circle cx="54" cy="112" r="4"/><circle cx="76" cy="112" r="4"/><circle cx="98" cy="112" r="4"/><circle cx="120" cy="112" r="4"/><circle cx="142" cy="112" r="4"/><circle cx="164" cy="112" r="4"/>
    <circle cx="54" cy="132" r="4"/><circle cx="76" cy="132" r="4"/><circle cx="98" cy="132" r="4"/><circle cx="120" cy="132" r="4"/><circle cx="142" cy="132" r="4"/><circle cx="164" cy="132" r="4"/>
    <circle cx="54" cy="152" r="4"/><circle cx="76" cy="152" r="4"/><circle cx="98" cy="152" r="4"/><circle cx="120" cy="152" r="4"/><circle cx="142" cy="152" r="4"/><circle cx="164" cy="152" r="4"/>
    <circle cx="54" cy="172" r="4"/><circle cx="76" cy="172" r="4"/><circle cx="98" cy="172" r="4"/><circle cx="120" cy="172" r="4"/><circle cx="142" cy="172" r="4"/><circle cx="164" cy="172" r="4"/>
    <circle cx="54" cy="192" r="4"/><circle cx="76" cy="192" r="4"/><circle cx="120" cy="192" r="4"/><circle cx="142" cy="192" r="4"/><circle cx="164" cy="192" r="4"/>
    <circle cx="54" cy="212" r="4"/><circle cx="76" cy="212" r="4"/><circle cx="120" cy="212" r="4"/><circle cx="142" cy="212" r="4"/><circle cx="164" cy="212" r="4"/>
  </g>
  <circle cx="98" cy="202" r="9" fill="#3b74d9"/>
  <path d="M 92 202 l 2 -3 l 2 6 l 2 -6 l 2 4 l 2 -1" stroke="#ffffff" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <line x1="98" y1="213" x2="98" y2="242" stroke="#3b74d9" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="98" y="256" text-anchor="middle" font-size="9.5" fill="#6b7280">one 3-sec clip:</text>
  <text x="98" y="271" text-anchor="middle" font-size="11" font-weight="700" fill="#3b74d9">Lupe — "yo"</text>

  <line x1="198" y1="170" x2="230" y2="170" stroke="#8a919c" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="214" y="158" text-anchor="middle" font-size="9" fill="#6b7280">shuffle</text>

  <!-- ============ EPOCH ============ -->
  <rect x="236" y="56" width="500" height="230" rx="12" fill="#f2faf5" stroke="#2f9e63" stroke-width="2"/>
  <text x="486" y="80" text-anchor="middle" font-size="12.5" fill="#1f7a49"><tspan font-weight="700">1 EPOCH</tspan><tspan fill="#5b6570" font-size="10.5"> — every clip seen once</tspan></text>

  <!-- batches row 1 -->
  <g>
    <rect x="252" y="96" width="84" height="72" rx="7" fill="#ffffff" stroke="#3b74d9" stroke-width="1.4"/>
    <text x="294" y="112" text-anchor="middle" font-size="9.5" fill="#3b74d9" font-weight="600">batch 1</text>
    <g fill="#ccd2da"><circle cx="274" cy="130" r="2.6"/><circle cx="294" cy="130" r="2.6"/><circle cx="314" cy="130" r="2.6"/><circle cx="274" cy="144" r="2.6"/><circle cx="294" cy="144" r="2.6"/><circle cx="314" cy="144" r="2.6"/><circle cx="274" cy="158" r="2.6"/><circle cx="294" cy="158" r="2.6"/><circle cx="314" cy="158" r="2.6"/></g>
  </g>
  <g>
    <rect x="348" y="96" width="84" height="72" rx="7" fill="#ffffff" stroke="#3b74d9" stroke-width="1.4"/>
    <text x="390" y="112" text-anchor="middle" font-size="9.5" fill="#3b74d9" font-weight="600">batch 2</text>
    <g fill="#ccd2da"><circle cx="370" cy="130" r="2.6"/><circle cx="390" cy="130" r="2.6"/><circle cx="410" cy="130" r="2.6"/><circle cx="370" cy="144" r="2.6"/><circle cx="390" cy="144" r="2.6"/><circle cx="410" cy="144" r="2.6"/><circle cx="370" cy="158" r="2.6"/><circle cx="390" cy="158" r="2.6"/><circle cx="410" cy="158" r="2.6"/></g>
  </g>
  <g>
    <rect x="444" y="96" width="84" height="72" rx="7" fill="#ffffff" stroke="#3b74d9" stroke-width="2.2"/>
    <text x="486" y="112" text-anchor="middle" font-size="9.5" fill="#3b74d9" font-weight="600">batch 3</text>
    <g fill="#ccd2da"><circle cx="466" cy="130" r="2.6"/><circle cx="486" cy="130" r="2.6"/><circle cx="506" cy="130" r="2.6"/><circle cx="466" cy="144" r="2.6"/><circle cx="506" cy="144" r="2.6"/><circle cx="466" cy="158" r="2.6"/><circle cx="486" cy="158" r="2.6"/><circle cx="506" cy="158" r="2.6"/></g>
    <circle cx="486" cy="144" r="5.5" fill="#3b74d9"/>
    <path d="M 482.5 144 l 1.2 -1.8 l 1.2 3.6 l 1.2 -3.6 l 1.2 2.4 l 1.2 -0.6" stroke="#ffffff" stroke-width="0.9" fill="none" stroke-linecap="round"/>
  </g>
  <g>
    <rect x="540" y="96" width="84" height="72" rx="7" fill="#ffffff" stroke="#3b74d9" stroke-width="1.4"/>
    <text x="582" y="112" text-anchor="middle" font-size="9.5" fill="#3b74d9" font-weight="600">batch 4</text>
    <g fill="#ccd2da"><circle cx="562" cy="130" r="2.6"/><circle cx="582" cy="130" r="2.6"/><circle cx="602" cy="130" r="2.6"/><circle cx="562" cy="144" r="2.6"/><circle cx="582" cy="144" r="2.6"/><circle cx="602" cy="144" r="2.6"/><circle cx="562" cy="158" r="2.6"/><circle cx="582" cy="158" r="2.6"/><circle cx="602" cy="158" r="2.6"/></g>
  </g>
  <g>
    <rect x="636" y="96" width="84" height="72" rx="7" fill="#ffffff" stroke="#3b74d9" stroke-width="1.4"/>
    <text x="678" y="112" text-anchor="middle" font-size="9.5" fill="#3b74d9" font-weight="600">batch 5</text>
    <g fill="#ccd2da"><circle cx="658" cy="130" r="2.6"/><circle cx="678" cy="130" r="2.6"/><circle cx="698" cy="130" r="2.6"/><circle cx="658" cy="144" r="2.6"/><circle cx="678" cy="144" r="2.6"/><circle cx="698" cy="144" r="2.6"/><circle cx="658" cy="158" r="2.6"/><circle cx="678" cy="158" r="2.6"/><circle cx="698" cy="158" r="2.6"/></g>
  </g>
  <!-- batches row 2 -->
  <g>
    <rect x="252" y="180" width="84" height="72" rx="7" fill="#ffffff" stroke="#3b74d9" stroke-width="1.4"/>
    <text x="294" y="196" text-anchor="middle" font-size="9.5" fill="#3b74d9" font-weight="600">batch 6</text>
    <g fill="#ccd2da"><circle cx="274" cy="214" r="2.6"/><circle cx="294" cy="214" r="2.6"/><circle cx="314" cy="214" r="2.6"/><circle cx="274" cy="228" r="2.6"/><circle cx="294" cy="228" r="2.6"/><circle cx="314" cy="228" r="2.6"/><circle cx="274" cy="242" r="2.6"/><circle cx="294" cy="242" r="2.6"/><circle cx="314" cy="242" r="2.6"/></g>
  </g>
  <g>
    <rect x="348" y="180" width="84" height="72" rx="7" fill="#ffffff" stroke="#3b74d9" stroke-width="1.4"/>
    <text x="390" y="196" text-anchor="middle" font-size="9.5" fill="#3b74d9" font-weight="600">batch 7</text>
    <g fill="#ccd2da"><circle cx="370" cy="214" r="2.6"/><circle cx="390" cy="214" r="2.6"/><circle cx="410" cy="214" r="2.6"/><circle cx="370" cy="228" r="2.6"/><circle cx="390" cy="228" r="2.6"/><circle cx="410" cy="228" r="2.6"/><circle cx="370" cy="242" r="2.6"/><circle cx="390" cy="242" r="2.6"/><circle cx="410" cy="242" r="2.6"/></g>
  </g>
  <g>
    <rect x="444" y="180" width="84" height="72" rx="7" fill="#ffffff" stroke="#3b74d9" stroke-width="1.4"/>
    <text x="486" y="196" text-anchor="middle" font-size="9.5" fill="#3b74d9" font-weight="600">batch 8</text>
    <g fill="#ccd2da"><circle cx="466" cy="214" r="2.6"/><circle cx="486" cy="214" r="2.6"/><circle cx="506" cy="214" r="2.6"/><circle cx="466" cy="228" r="2.6"/><circle cx="486" cy="228" r="2.6"/><circle cx="506" cy="228" r="2.6"/><circle cx="466" cy="242" r="2.6"/><circle cx="486" cy="242" r="2.6"/><circle cx="506" cy="242" r="2.6"/></g>
  </g>
  <g>
    <rect x="540" y="180" width="84" height="72" rx="7" fill="#ffffff" stroke="#3b74d9" stroke-width="1.4"/>
    <text x="582" y="196" text-anchor="middle" font-size="9.5" fill="#3b74d9" font-weight="600">batch 9</text>
    <g fill="#ccd2da"><circle cx="562" cy="214" r="2.6"/><circle cx="582" cy="214" r="2.6"/><circle cx="602" cy="214" r="2.6"/><circle cx="562" cy="228" r="2.6"/><circle cx="582" cy="228" r="2.6"/><circle cx="602" cy="228" r="2.6"/><circle cx="562" cy="242" r="2.6"/><circle cx="582" cy="242" r="2.6"/><circle cx="602" cy="242" r="2.6"/></g>
  </g>
  <g>
    <rect x="636" y="180" width="84" height="72" rx="7" fill="#ffffff" stroke="#3b74d9" stroke-width="1.4"/>
    <text x="678" y="196" text-anchor="middle" font-size="9.5" fill="#3b74d9" font-weight="600">batch 10</text>
    <g fill="#ccd2da"><circle cx="658" cy="214" r="2.6"/><circle cx="678" cy="214" r="2.6"/><circle cx="698" cy="214" r="2.6"/><circle cx="658" cy="228" r="2.6"/><circle cx="678" cy="228" r="2.6"/><circle cx="698" cy="228" r="2.6"/><circle cx="658" cy="242" r="2.6"/><circle cx="678" cy="242" r="2.6"/><circle cx="698" cy="242" r="2.6"/></g>
  </g>

  <path d="M 660 287 C 660 318, 312 318, 312 291" fill="none" stroke="#2f9e63" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrGreen)"/>
  <text x="486" y="332" text-anchor="middle" font-size="10" fill="#2f9e63">repeats — clips reshuffled every epoch</text>

  <!-- ============ ZOOM: ITERATION / STEP ============ -->
  <line x1="720" y1="96" x2="760" y2="60" stroke="#c3c9d2" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="720" y1="168" x2="760" y2="282" stroke="#c3c9d2" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="760" y="56" width="216" height="230" rx="10" fill="#fbfbfc" stroke="#c3c9d2" stroke-dasharray="5 4"/>
  <text x="868" y="78" text-anchor="middle" font-size="10" fill="#6b7280">inside any batch</text>

  <rect x="776" y="90" width="184" height="66" rx="7" fill="#f5f0fd" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="868" y="110" text-anchor="middle" font-size="11" font-weight="700" fill="#7444d6">ITERATION</text>
  <text x="868" y="126" text-anchor="middle" font-size="9.5" fill="#5b6570">forward + backward pass</text>
  <text x="868" y="140" text-anchor="middle" font-size="9.5" fill="#5b6570">&#8594; gradients</text>

  <line x1="868" y1="158" x2="868" y2="170" stroke="#8a919c" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="776" y="174" width="184" height="62" rx="7" fill="#fdf6e1" stroke="#d99a06" stroke-width="1.5"/>
  <text x="868" y="194" text-anchor="middle" font-size="11" font-weight="700" fill="#a97800">STEP</text>
  <text x="868" y="211" text-anchor="middle" font-size="9.5" fill="#5b6570">weights updated once</text>

  <text x="868" y="262" text-anchor="middle" font-size="9" font-style="italic" fill="#6b7280">here: 1 iteration = 1 step</text>

  <!-- ============ TIMELINE ============ -->
  <text x="40" y="374" font-size="11" font-weight="700" fill="#4b5563" letter-spacing="1">TRAINING TIMELINE</text>
  <line x1="40" y1="470" x2="952" y2="470" stroke="#b9bec6" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="60" y="426" font-size="9.5" fill="#3b74d9">"yo" is trained on once per epoch — in a different batch each time</text>

  <!-- epoch 1 ticks -->
  <g stroke="#d99a06" stroke-width="2.5">
    <line x1="70" y1="460" x2="70" y2="480"/><line x1="90" y1="460" x2="90" y2="480"/><line x1="110" y1="460" x2="110" y2="480"/><line x1="130" y1="460" x2="130" y2="480"/><line x1="150" y1="460" x2="150" y2="480"/><line x1="170" y1="460" x2="170" y2="480"/><line x1="190" y1="460" x2="190" y2="480"/><line x1="210" y1="460" x2="210" y2="480"/><line x1="230" y1="460" x2="230" y2="480"/><line x1="250" y1="460" x2="250" y2="480"/>
  </g>
  <!-- epoch 2 ticks -->
  <g stroke="#d99a06" stroke-width="2.5">
    <line x1="285" y1="460" x2="285" y2="480"/><line x1="305" y1="460" x2="305" y2="480"/><line x1="325" y1="460" x2="325" y2="480"/><line x1="345" y1="460" x2="345" y2="480"/><line x1="365" y1="460" x2="365" y2="480"/><line x1="385" y1="460" x2="385" y2="480"/><line x1="405" y1="460" x2="405" y2="480"/><line x1="425" y1="460" x2="425" y2="480"/><line x1="445" y1="460" x2="445" y2="480"/><line x1="465" y1="460" x2="465" y2="480"/>
  </g>
  <!-- epoch 3 ticks -->
  <g stroke="#d99a06" stroke-width="2.5">
    <line x1="500" y1="460" x2="500" y2="480"/><line x1="520" y1="460" x2="520" y2="480"/><line x1="540" y1="460" x2="540" y2="480"/><line x1="560" y1="460" x2="560" y2="480"/><line x1="580" y1="460" x2="580" y2="480"/><line x1="600" y1="460" x2="600" y2="480"/><line x1="620" y1="460" x2="620" y2="480"/><line x1="640" y1="460" x2="640" y2="480"/><line x1="660" y1="460" x2="660" y2="480"/><line x1="680" y1="460" x2="680" y2="480"/>
  </g>
  <!-- epoch 4 ticks -->
  <g stroke="#d99a06" stroke-width="2.5">
    <line x1="715" y1="460" x2="715" y2="480"/><line x1="735" y1="460" x2="735" y2="480"/><line x1="755" y1="460" x2="755" y2="480"/><line x1="775" y1="460" x2="775" y2="480"/><line x1="795" y1="460" x2="795" y2="480"/><line x1="815" y1="460" x2="815" y2="480"/><line x1="835" y1="460" x2="835" y2="480"/><line x1="855" y1="460" x2="855" y2="480"/><line x1="875" y1="460" x2="875" y2="480"/><line x1="895" y1="460" x2="895" y2="480"/>
  </g>
  <text x="928" y="475" font-size="12" fill="#6b7280">&#8230;</text>

  <text x="250" y="496" text-anchor="middle" font-size="8.5" fill="#6b7280">step 10</text>
  <text x="465" y="496" text-anchor="middle" font-size="8.5" fill="#6b7280">20</text>
  <text x="680" y="496" text-anchor="middle" font-size="8.5" fill="#6b7280">30</text>
  <text x="895" y="496" text-anchor="middle" font-size="8.5" fill="#6b7280">40</text>

  <!-- "yo" appearances -->
  <g>
    <circle cx="110" cy="444" r="5" fill="#3b74d9"/><line x1="110" y1="450" x2="110" y2="458" stroke="#3b74d9" stroke-width="1"/>
    <circle cx="405" cy="444" r="5" fill="#3b74d9"/><line x1="405" y1="450" x2="405" y2="458" stroke="#3b74d9" stroke-width="1"/>
    <circle cx="520" cy="444" r="5" fill="#3b74d9"/><line x1="520" y1="450" x2="520" y2="458" stroke="#3b74d9" stroke-width="1"/>
    <circle cx="875" cy="444" r="5" fill="#3b74d9"/><line x1="875" y1="450" x2="875" y2="458" stroke="#3b74d9" stroke-width="1"/>
  </g>

  <!-- epoch brackets -->
  <g stroke="#2f9e63" stroke-width="1.5" fill="none">
    <path d="M 66 503 v 5 h 188 v -5"/>
    <path d="M 281 503 v 5 h 188 v -5"/>
    <path d="M 496 503 v 5 h 188 v -5"/>
    <path d="M 711 503 v 5 h 188 v -5"/>
  </g>
  <text x="160" y="524" text-anchor="middle" font-size="10" fill="#2f9e63" font-weight="600">epoch 1</text>
  <text x="375" y="524" text-anchor="middle" font-size="10" fill="#2f9e63" font-weight="600">epoch 2</text>
  <text x="590" y="524" text-anchor="middle" font-size="10" fill="#2f9e63" font-weight="600">epoch 3</text>
  <text x="805" y="524" text-anchor="middle" font-size="10" fill="#2f9e63" font-weight="600">epoch 4</text>

  <!-- checkpoints -->
  <g>
    <line x1="465" y1="480" x2="465" y2="540" stroke="#e0731d" stroke-width="2"/>
    <rect x="455" y="542" width="20" height="20" rx="2.5" fill="#e0731d"/>
    <rect x="459" y="545" width="12" height="6" rx="1" fill="#ffffff" opacity="0.9"/>
    <rect x="462" y="554" width="6" height="6" fill="#ffffff" opacity="0.9"/>
    <text x="465" y="578" text-anchor="middle" font-size="9" font-weight="600" fill="#e0731d">model_20</text>
  </g>
  <g>
    <line x1="895" y1="480" x2="895" y2="540" stroke="#e0731d" stroke-width="2"/>
    <rect x="885" y="542" width="20" height="20" rx="2.5" fill="#e0731d"/>
    <rect x="889" y="545" width="12" height="6" rx="1" fill="#ffffff" opacity="0.9"/>
    <rect x="892" y="554" width="6" height="6" fill="#ffffff" opacity="0.9"/>
    <text x="895" y="578" text-anchor="middle" font-size="9" font-weight="600" fill="#e0731d">model_40</text>
  </g>
  <text x="680" y="596" text-anchor="middle" font-size="9.5" fill="#e0731d">checkpoint = full model saved, every 20 steps</text>

  <!-- ============ LEGEND ============ -->
  <g font-size="9.5" fill="#4b5563">
    <circle cx="60" cy="618" r="5" fill="#3b74d9"/>
    <text x="70" y="622">clip</text>
    <rect x="106" y="611" width="16" height="12" rx="3" fill="#ffffff" stroke="#3b74d9" stroke-width="1.4"/>
    <text x="128" y="622">batch = 100 clips</text>
    <circle cx="230" cy="618" r="5" fill="#8b5cf6"/>
    <text x="240" y="622">iteration = fwd + bwd</text>
    <line x1="352" y1="610" x2="352" y2="626" stroke="#d99a06" stroke-width="2.5"/>
    <text x="360" y="622">step = 1 weight update</text>
    <path d="M 478 615 v 5 h 20 v -5" stroke="#2f9e63" stroke-width="1.5" fill="none"/>
    <text x="506" y="622">epoch = all 1,000 clips once</text>
    <rect x="646" y="611" width="13" height="13" rx="2" fill="#e0731d"/>
    <text x="666" y="622">checkpoint = saved model</text>
  </g>

  <text x="500" y="652" text-anchor="middle" font-size="9" fill="#9aa1ab">real Lupe run: ~350 clips &#183; batch 32 &#8594; 11 steps/epoch &#183; checkpoint + validation every 200 steps &#183; early-stopped at step 2,200 of ~11,000</text>
</svg>
